name: blue_buds
description: Anonymous nearby Bluetooth chat. Fully offline, private, no accounts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State & storage
  flutter_riverpod: ^3.4.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # BLE (cross-platform central + peripheral)
  bluetooth_low_energy: ^6.2.1

  # Crypto (E2E session keys)
  cryptography: ^2.7.0
  convert: ^3.1.2

  # UI & utils
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  permission_handler: ^13.0.2
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.3.4
  intl: ^0.20.3

  # Image handling
  image_picker: ^1.1.2
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

