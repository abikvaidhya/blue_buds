name: blue_buds
description: Anonymous nearby Bluetooth chat. Fully offline, private, no accounts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State & storage
  flutter_riverpod:
  hive:
  hive_flutter:
  path_provider:

  # BLE (cross-platform central + peripheral)
  bluetooth_low_energy:

  # Crypto (E2E session keys)
  cryptography:
  convert:

  # UI & utils
  flutter_animate:
  uuid:
  permission_handler:
  flutter_local_notifications:
  shared_preferences:
  intl:
  package_info_plus:

  # Image handling
  image_picker:
  image:


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
